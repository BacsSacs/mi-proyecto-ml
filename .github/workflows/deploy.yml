name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - uses: actions/checkout@v4

    # 2. Login al Container Registry de Azure
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: acrmiprojectobacs.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Construir la imagen Docker y subirla al ACR con tag v2
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: acrmiprojectobacs.azurecr.io/ml-api:v2

    # 4. Login a Azure con el Service Principal
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 5. Desplegar en Container Apps apuntando a la imagen v2
    - name: Deploy to Container Apps
      run: |
        az containerapp create \
          --name api-mi-proyecto \
          --resource-group rg-mlops-ean \
          --environment env-mi-proyecto \
          --image acrmiprojectobacs.azurecr.io/ml-api:v2 \
          --registry-server acrmiprojectobacs.azurecr.io \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --target-port 8000 \
          --ingress external \
          --min-replicas 1 \
          --env-vars \
            DATABRICKS_URL=${{ secrets.DATABRICKS_URL }} \
            DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }} || \
        az containerapp update \
          --name api-mi-proyecto \
          --resource-group rg-mlops-ean \
          --image acrmiprojectobacs.azurecr.io/ml-api:v2 \
          --set-env-vars \
            DATABRICKS_URL=${{ secrets.DATABRICKS_URL }} \
            DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}