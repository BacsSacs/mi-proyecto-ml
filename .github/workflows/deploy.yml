name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - uses: actions/checkout@v3

    # 2. Login al Container Registry de Azure
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: acrmiprojecto.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Construir la imagen Docker y subirla al ACR
    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: acrmiprojecto.azurecr.io/ml-api:latest

    # 4. Login a Azure con el Service Principal
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 5. Desplegar en Container Apps
    #    DATABRICKS_URL   → URL del endpoint Leo_EAN
    #    DATABRICKS_TOKEN → token de autenticación
    #    create = primer despliegue | update = actualizaciones posteriores
    - name: Deploy to Container Apps
      run: |
        az containerapp create \
          --name api-mi-proyecto \
          --resource-group rg-mi-proyecto \
          --environment env-mi-proyecto \
          --image acrmiprojecto.azurecr.io/ml-api:latest \
          --registry-server acrmiprojecto.azurecr.io \
          --registry-username ${{ secrets.ACR_USERNAME }} \
          --registry-password ${{ secrets.ACR_PASSWORD }} \
          --target-port 8000 \
          --ingress external \
          --min-replicas 1 \
          --env-vars \
            DATABRICKS_URL=${{ secrets.DATABRICKS_URL }} \
            DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }} || \
        az containerapp update \
          --name api-mi-proyecto \
          --resource-group rg-mi-proyecto \
          --image acrmiprojecto.azurecr.io/ml-api:latest \
          --set-env-vars \
            DATABRICKS_URL=${{ secrets.DATABRICKS_URL }} \
            DATABRICKS_TOKEN=${{ secrets.DATABRICKS_TOKEN }}